# 「空间」自己的 xochitl 环境, 与底座 (zz-rmkit-cn.conf) 并存。
#
# systemd 会把 xochitl.service.d/ 下所有 .conf 合并, 所以空间不必回头去改底座 ——
# 底座冻在公开仓库里不动, 空间要什么自己加。这一条很重要: 否则空间每加一个能力
# 就得让所有人先去更新那个"已停止更新"的底座, 等于两边都冻不住。
#
# QML_IMPORT_PATH: 编译发布的应用 (.so 形式的 QML 模块) 靠 import 查找, 而搜索路径
# 只认 xochitl 启动时的环境变量。绿色安装却是随时发生的 —— 装一个应用就改环境变量
# 再重启整个界面不现实, 所以位置写死, 后端只管往里放。
[Service]
Environment="QML_IMPORT_PATH=/home/root/.local/share/rmkit-cn/space/qmlmods"
